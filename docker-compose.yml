services:
  mongodb:
    image: mongo:7
    container_name: fls-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./fls-backend
      dockerfile: Dockerfile
    image: fls-backend:latest
    container_name: fls-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/fls_school
      - JWT_SECRET=fls-jwt-secret-key-change-in-production
      - JWT_EXPIRES_IN=1d
      - ADMIN_EMAIL=admin@fls.school
      - ADMIN_PASSWORD=ChangeMe123!
      - PORT=3000
      - CORS_ORIGIN=*
      - SEED_ON_STARTUP=true
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./fls-admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    image: fls-frontend:latest
    container_name: fls-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
