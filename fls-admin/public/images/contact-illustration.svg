<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="contactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2A5B" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect x="20" y="20" width="560" height="410" rx="30" fill="url(#contactGrad)" />

  <!-- Stylized folded map background -->
  <g filter="url(#cShadow)">
    <polygon points="120,160 220,130 320,160 420,130 480,150 480,330 420,310 320,340 220,310 120,340" fill="#FFFFFF" />
    <polygon points="220,130 320,160 320,340 220,310" fill="#F8FAFC" />
    <polygon points="420,130 480,150 480,330 420,310" fill="#F1F5F9" />

    <!-- Map road lines -->
    <path d="M 140,280 Q 200,240 280,260 T 440,220" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round" />
    <path d="M 180,310 Q 260,280 340,300 T 460,260" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <path d="M 280,150 L 280,320" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />

    <!-- Giant Location Pin -->
    <g transform="translate(260, 140)">
      <path d="M 40,0 C 18,0 0,18 0,40 C 0,70 40,110 40,110 C 40,110 80,70 80,40 C 80,18 62,0 40,0 Z" fill="url(#pinGrad)" />
      <circle cx="40" cy="40" r="16" fill="#FFFFFF" />
      <circle cx="40" cy="40" r="8" fill="#B91C1C" />
    </g>
  </g>

  <!-- Left Float: Call card -->
  <g filter="url(#cShadow)">
    <rect x="60" y="70" width="160" height="60" rx="14" fill="#FFFFFF" />
    <circle cx="90" cy="100" r="18" fill="url(#phoneGrad)" />
    <!-- Phone icon -->
    <path d="M 85 93 C 85 93 88 95 89 97 C 90 98 89 99 88 100 C 89 102 91 104 93 105 C 94 104 95 103 96 104 C 98 105 100 108 100 108 C 100 108 99 110 97 110 C 94 110 90 108 86 104 C 82 100 80 96 80 93 C 80 91 82 90 85 90 Z" fill="#FFFFFF" transform="scale(0.85) translate(15, 12)" />
    <text x="120" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B2A5B">À votre écoute</text>
    <text x="120" y="112" font-family="sans-serif" font-size="9" fill="#10B981">Réponse rapide</text>
  </g>

  <!-- Right Float: Pre-inscription card -->
  <g filter="url(#cShadow)">
    <rect x="380" y="270" width="170" height="65" rx="14" fill="#FFFFFF" />
    <circle cx="410" cy="302" r="18" fill="#10B981" />
    <!-- Checkmark -->
    <path d="M 403 302 L 408 307 L 418 296" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="438" y="297" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B2A5B">Inscription en ligne</text>
    <text x="438" y="313" font-family="sans-serif" font-size="9" fill="#64748B">Simple & sans frais</text>
  </g>
</svg>
