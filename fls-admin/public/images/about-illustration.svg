<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FE" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B2A5B" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A5B" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Backdrop circle -->
  <rect x="20" y="20" width="560" height="410" rx="30" fill="url(#aboutBg)" />

  <!-- School Campus / Academy Building -->
  <g filter="url(#softShadow)">
    <!-- Base step -->
    <rect x="130" y="340" width="340" height="15" rx="3" fill="#94A3B8" />
    <rect x="145" y="325" width="310" height="15" rx="3" fill="#CBD5E1" />

    <!-- Building body -->
    <rect x="160" y="180" width="280" height="145" fill="#FFFFFF" />

    <!-- Classical Columns -->
    <rect x="180" y="195" width="20" height="130" fill="#E2E8F0" rx="2" />
    <rect x="235" y="195" width="20" height="130" fill="#E2E8F0" rx="2" />
    <rect x="345" y="195" width="20" height="130" fill="#E2E8F0" rx="2" />
    <rect x="400" y="195" width="20" height="130" fill="#E2E8F0" rx="2" />

    <!-- Arch entrance door -->
    <path d="M 275 325 L 275 255 A 25 25 0 0 1 325 255 L 325 325 Z" fill="#0B2A5B" />
    <circle cx="318" cy="290" r="3" fill="#F8C42E" />

    <!-- Classical pediment / triangular roof -->
    <polygon points="150,180 300,105 450,180" fill="url(#roofGrad)" />

    <!-- School Clock / Emblem on pediment -->
    <circle cx="300" cy="150" r="18" fill="#FFFFFF" stroke="#F8C42E" stroke-width="3" />
    <line x1="300" y1="150" x2="300" y2="140" stroke="#0B2A5B" stroke-width="2" stroke-linecap="round" />
    <line x1="300" y1="150" x2="308" y2="150" stroke="#0B2A5B" stroke-width="2" stroke-linecap="round" />

    <!-- School Flag on top -->
    <line x1="300" y1="105" x2="300" y2="65" stroke="#64748B" stroke-width="3" />
    <polygon points="300,65 340,77 300,90" fill="#F8C42E" />
  </g>

  <!-- Trees / Greenery -->
  <g>
    <!-- Left tree -->
    <rect x="100" y="310" width="12" height="35" rx="3" fill="#78350F" />
    <circle cx="106" cy="275" r="32" fill="#10B981" />
    <circle cx="118" cy="265" r="22" fill="#34D399" />

    <!-- Right tree -->
    <rect x="480" y="310" width="12" height="35" rx="3" fill="#78350F" />
    <circle cx="486" cy="270" r="34" fill="#059669" />
    <circle cx="475" cy="260" r="24" fill="#34D399" />
  </g>

  <!-- Floating Achievement badge: "Apprentissage Actif" -->
  <g filter="url(#softShadow)">
    <rect x="40" y="70" width="165" height="54" rx="14" fill="#FFFFFF" />
    <circle cx="68" cy="97" r="15" fill="#3B82F6" />
    <!-- Book icon -->
    <path d="M 61 93 Q 68 91 75 93 L 75 102 Q 68 100 61 102 Z" fill="#FFFFFF" />
    <text x="92" y="93" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B2A5B">Pédagogie</text>
    <text x="92" y="108" font-family="sans-serif" font-size="9" fill="#64748B">Méthodes modernes</text>
  </g>

  <!-- Floating Achievement badge: "Réussite & Avenir" -->
  <g filter="url(#softShadow)">
    <rect x="390" y="80" width="165" height="54" rx="14" fill="#FFFFFF" />
    <circle cx="418" cy="107" r="15" fill="url(#sunGrad)" />
    <!-- Star icon -->
    <polygon points="418,97 421,104 428,105 423,109 425,116 418,112 412,116 414,109 409,105 416,104" fill="#FFFFFF" />
    <text x="442" y="103" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B2A5B">Épanouissement</text>
    <text x="442" y="118" font-family="sans-serif" font-size="9" fill="#64748B">Cadre bienveillant</text>
  </g>

  <!-- Pathway -->
  <polygon points="265,340 335,340 375,410 225,410" fill="#E2E8F0" />
</svg>
