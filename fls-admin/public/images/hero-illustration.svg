<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2A5B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B2A5B" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2A5B" flood-opacity="0.15" />
    </filter>
    <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B2A5B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background decorative blobs -->
  <circle cx="300" cy="225" r="180" fill="url(#bgGrad)" />
  <circle cx="480" cy="110" r="45" fill="#F8C42E" fill-opacity="0.15" />
  <circle cx="100" cy="340" r="60" fill="#3B82F6" fill-opacity="0.08" />

  <!-- Main illustration platform / desk -->
  <ellipse cx="300" cy="360" rx="230" ry="24" fill="#E2E8F0" />
  <ellipse cx="300" cy="358" rx="200" ry="18" fill="#CBD5E1" />

  <!-- Computer monitor / laptop base -->
  <g filter="url(#shadow1)">
    <!-- Base -->
    <path d="M 210 330 L 390 330 L 405 342 L 195 342 Z" fill="#94A3B8" />
    <!-- Screen back -->
    <rect x="220" y="160" width="160" height="160" rx="10" fill="#0B2A5B" />
    <!-- Screen glass -->
    <rect x="226" y="166" width="148" height="135" rx="6" fill="#1E293B" />
    <!-- Screen content -->
    <rect x="238" y="178" width="55" height="6" rx="3" fill="#60A5FA" />
    <rect x="238" y="190" width="90" height="4" rx="2" fill="#94A3B8" />
    <rect x="238" y="198" width="70" height="4" rx="2" fill="#94A3B8" />

    <!-- Chart on screen -->
    <line x1="238" y1="270" x2="362" y2="270" stroke="#334155" stroke-width="2" />
    <rect x="250" y="240" width="14" height="30" rx="2" fill="#3B82F6" />
    <rect x="272" y="225" width="14" height="45" rx="2" fill="#F8C42E" />
    <rect x="294" y="210" width="14" height="60" rx="2" fill="#10B981" />
    <rect x="316" y="230" width="14" height="40" rx="2" fill="#6366F1" />
    <circle cx="300" cy="315" r="4" fill="#64748B" />
  </g>

  <!-- Stack of textbooks (Left) -->
  <g filter="url(#shadowSmall)">
    <!-- Book 1 (bottom, blue) -->
    <path d="M 110 325 L 195 325 L 190 345 L 105 345 Z" fill="#1D4ED8" />
    <rect x="105" y="325" width="85" height="20" rx="4" fill="#2563EB" />
    <line x1="120" y1="335" x2="175" y2="335" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />

    <!-- Book 2 (middle, yellow) -->
    <rect x="115" y="305" width="75" height="18" rx="4" fill="#F59E0B" />
    <line x1="128" y1="314" x2="170" y2="314" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" />

    <!-- Book 3 (top, dark navy) -->
    <rect x="120" y="288" width="65" height="16" rx="3" fill="#0B2A5B" />
    <line x1="130" y1="296" x2="168" y2="296" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Coffee mug -->
    <rect x="155" y="250" width="22" height="28" rx="3" fill="#EF4444" />
    <path d="M 177 256 C 185 256, 185 272, 177 272" fill="none" stroke="#EF4444" stroke-width="3" />
  </g>

  <!-- Graduation Cap (floating top right of screen) -->
  <g filter="url(#shadow1)">
    <!-- Cap top diamond -->
    <polygon points="380,120 440,95 500,120 440,145" fill="url(#navyGrad)" />
    <!-- Cap skull cap -->
    <path d="M 405 132 L 405 152 C 405 168, 475 168, 475 152 L 475 132 Z" fill="#071A3D" />
    <!-- Tassel button -->
    <circle cx="440" cy="120" r="4.5" fill="#F8C42E" />
    <!-- Tassel string & fringe -->
    <path d="M 440 120 Q 480 135 482 165" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <rect x="478" y="165" width="8" height="16" rx="2" fill="#F59E0B" />
  </g>

  <!-- Diploma scroll (Right side) -->
  <g filter="url(#shadowSmall)">
    <rect x="415" y="295" width="80" height="42" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="2" />
    <rect x="445" y="293" width="16" height="46" rx="2" fill="#DC2626" />
    <!-- Ribbon bow -->
    <circle cx="453" cy="316" r="4" fill="#B91C1C" />
    <path d="M 453 316 L 442 335" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />
    <path d="M 453 316 L 464 335" stroke="#DC2626" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Achievement Card 1: Top Left "Excellence A+" -->
  <g filter="url(#shadowSmall)">
    <rect x="75" y="100" width="135" height="60" rx="14" fill="#FFFFFF" />
    <circle cx="105" cy="130" r="18" fill="url(#goldGrad)" />
    <text x="105" y="136" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A+</text>
    <text x="135" y="125" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B2A5B">Excellence</text>
    <text x="135" y="142" font-family="sans-serif" font-size="10" fill="#64748B">Résultats 100%</text>
  </g>

  <!-- Floating Achievement Card 2: Right "Suivi Personnalisé" -->
  <g filter="url(#shadowSmall)">
    <rect x="420" y="195" width="145" height="58" rx="14" fill="#FFFFFF" />
    <circle cx="448" cy="224" r="16" fill="#10B981" />
    <!-- Checkmark -->
    <path d="M 442 224 L 446 228 L 454 220" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="472" y="219" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0B2A5B">Suivi garanti</text>
    <text x="472" y="235" font-family="sans-serif" font-size="9" fill="#64748B">Encadrement pro</text>
  </g>

  <!-- Sparkles / Stars -->
  <g fill="#F8C42E">
    <path d="M 230 110 L 233 118 L 241 121 L 233 124 L 230 132 L 227 124 L 219 121 L 227 118 Z" />
    <path d="M 495 65 L 497 71 L 503 73 L 497 75 L 495 81 L 493 75 L 487 73 L 493 71 Z" />
    <path d="M 120 220 L 122 225 L 127 227 L 122 229 L 120 234 L 118 229 L 113 227 L 118 225 Z" />
  </g>
</svg>
